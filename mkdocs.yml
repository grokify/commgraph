site_name: CommGraph
site_description: Communication graph analysis framework for organizational communication patterns
site_url: https://grokify.github.io/commgraph
repo_url: https://github.com/grokify/commgraph
repo_name: grokify/commgraph

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Enron Tutorial: getting-started/enron-tutorial.md
  - User Guide:
      - CLI Reference: guide/cli.md
      - Configuration: guide/configuration.md
      - Analysis Types: guide/analysis.md
      - Export Formats: guide/export.md
      - Identity Resolution: guide/identity.md
  - Reference:
      - Architecture: reference/architecture.md
      - Weight Profiles: reference/weight-profiles.md
      - Roadmap: reference/roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/commgraph
